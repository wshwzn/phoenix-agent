spring:
  application:
    name: phoenix-demo
  lifecycle:
    timeout-per-shutdown-phase: 10s
  data:
    redis:
      host: ${PHOENIX_DEMO_REDIS_HOST:127.0.0.1}
      port: ${PHOENIX_DEMO_REDIS_PORT:16379}
      connect-timeout: 500ms
      timeout: 500ms
      lettuce:
        shutdown-timeout: 100ms

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Phoenix Redis 故障演示应用（探活不依赖 Redis，商品接口依赖 Redis）

phoenix:
  demo:
    diagnostic-log: ${PHOENIX_DEMO_LOG_FILE:./logs/diagnostic.log}
