spring:
  application:
    name: phoenix-server
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Phoenix Agent 控制端（已接入 MCP 连通性检查）

phoenix:
  mcp:
    server-url: ${PHOENIX_MCP_SERVER_URL:http://127.0.0.1:18081/mcp}
    request-timeout: ${PHOENIX_MCP_REQUEST_TIMEOUT:5s}
