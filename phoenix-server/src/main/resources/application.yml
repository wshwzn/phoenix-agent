spring:
  application:
    name: phoenix-server
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Phoenix Agent 控制端（支持模型自主调用 MCP ping）

phoenix:
  model:
    enabled: ${PHOENIX_MODEL_ENABLED:false}
    base-url: ${PHOENIX_MODEL_BASE_URL:}
    model-name: ${PHOENIX_MODEL_NAME:}
    api-key: ${PHOENIX_MODEL_API_KEY:}
    request-timeout: ${PHOENIX_MODEL_REQUEST_TIMEOUT:30s}
    max-output-tokens: ${PHOENIX_MODEL_MAX_OUTPUT_TOKENS:2048}
  chat:
    max-tool-rounds: ${PHOENIX_CHAT_MAX_TOOL_ROUNDS:3}
    max-tool-calls: ${PHOENIX_CHAT_MAX_TOOL_CALLS:3}
  mcp:
    server-url: ${PHOENIX_MCP_SERVER_URL:http://127.0.0.1:18081/mcp}
    request-timeout: ${PHOENIX_MCP_REQUEST_TIMEOUT:5s}
