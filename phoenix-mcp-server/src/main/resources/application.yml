spring:
  application:
    name: phoenix-mcp-server
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Phoenix MCP 工具服务（固定目标的只读应用、Redis 和日志采集）

phoenix:
  diagnostic:
    application-base-url: ${PHOENIX_DEMO_BASE_URL:http://127.0.0.1:18082}
    redis-host: ${PHOENIX_DEMO_REDIS_HOST:127.0.0.1}
    redis-port: ${PHOENIX_DEMO_REDIS_PORT:16379}
    log-file: ${PHOENIX_DEMO_LOG_FILE:../demo/logs/diagnostic.log}
    probe-timeout: 500ms
